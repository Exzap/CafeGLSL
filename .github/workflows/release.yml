name: Prepare release draft

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release, e.g. v0.3.0. Created at the current commit if it does not exist.'
        required: true
        type: string
      prerelease:
        description: 'Mark the draft as a pre-release when published'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml

  release:
    name: Create editable draft
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Resolve the tag and version
        # Through the environment, so a tag name is never spliced into the shell.
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = 'workflow_dispatch' ]; then
            TAG="$INPUT_TAG"
          else
            TAG="$REF_NAME"
          fi

          case "$TAG" in
            v*) ;;
            *) echo "expected a tag starting with v, got '$TAG'" >&2; exit 1 ;;
          esac

          VERSION="${TAG#v}"
          DECLARED="$(./cafecompiler/ci/version.sh)"
          if [ "$VERSION" != "$DECLARED" ]; then
            echo "::warning::tag $TAG does not match cafeglsl_version $DECLARED in cafecompiler/meson.build"
          fi

          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build the archives
        run: ./cafecompiler/ci/archive.sh artifacts dist "$VERSION"

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ inputs.prerelease && '--prerelease' || '' }}
        run: |
          NOTES="$(cat <<'NOTES_TEXT'
          ## Breaking changes

          - [Describe breaking changes, or remove this section.]

          ## Changelog

          - [Summarize the changes in this release.]

          ## Downloads

          | Platform | Download | SHA-256 |
          | --- | --- | --- |
          NOTES_TEXT
          )"

          add_download() {
            local platform="$1" suffix="$2" label="$3"
            local filename="cafeglsl-${VERSION}-${suffix}"
            local archive="dist/${filename}"
            test -f "$archive" || { echo "Missing archive: $archive" >&2; exit 1; }
            local hash
            hash="$(sha256sum "$archive")"
            hash="${hash%% *}"
            NOTES="${NOTES}
          | ${platform} | [${label}](https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${filename}) | \`${hash}\` |"
          }

          add_download 'Wii U' 'wiiu-ppc.tar.xz' 'Static library'
          add_download 'Linux (x86-64)' 'linux-x86_64.tar.xz' 'Compiler and library'
          add_download 'Windows (x86-64)' 'windows-x86_64.zip' 'Compiler and library'
          add_download 'macOS (Apple Silicon)' 'macos-arm64.tar.xz' 'Compiler and library'
          add_download 'macOS (Intel)' 'macos-x86_64.tar.xz' 'Compiler and library'

          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "CafeGLSL $TAG" \
            --notes "$NOTES" \
            --draft $PRERELEASE \
            dist/*

          RELEASE_URL="$(gh release view "$TAG" --json url --jq .url)"
          echo "[Edit the $TAG draft release]($RELEASE_URL), then publish it from GitHub when ready." >> "$GITHUB_STEP_SUMMARY"
